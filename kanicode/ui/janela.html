<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>KaniCode</title>
<style>
  :root {
    --lima: #B6F23A; --lima-suave: rgba(182, 242, 58, .12); --fundo: #0E1110; --painel: #151A18; --borda: #26302B;
    --texto: #E6EDE8; --fraco: #8A988F; --erro: #FF8A8E; --aviso: #F0C04A;
    --mono: "Cascadia Mono", Consolas, monospace; --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font: 13.5px/1.5 var(--sans); }
  body { display: flex; flex-direction: column; border: 1px solid var(--borda); }
  /* bordas para esticar a janela (sem moldura): faixas finas nas 4 bordas e nos cantos */
  .tam { position: fixed; z-index: 99; }
  .tam.n, .tam.s { left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
  .tam.n { top: 0; } .tam.s { bottom: 0; }
  .tam.l, .tam.o { top: 8px; bottom: 8px; width: 5px; cursor: ew-resize; }
  .tam.o { left: 0; } .tam.l { right: 0; }
  .tam.no, .tam.ne, .tam.so, .tam.se { width: 12px; height: 12px; }
  .tam.no { left: 0; top: 0; cursor: nwse-resize; } .tam.se { right: 0; bottom: 0; cursor: nwse-resize; }
  .tam.ne { right: 0; top: 0; cursor: nesw-resize; } .tam.so { left: 0; bottom: 0; cursor: nesw-resize; }
  .tam.se::after { content: ''; position: absolute; right: 3px; bottom: 3px; width: 6px; height: 6px;
                   border-right: 2px solid var(--borda); border-bottom: 2px solid var(--borda); }
  .tam.se:hover::after { border-color: var(--lima); }
  /* topo: arrastar a janela por aqui */
  .topo { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px 0 12px; background: var(--painel);
          border-bottom: 1px solid var(--borda); user-select: none; }
  .marca { font: 700 13px var(--mono); color: var(--fundo); background: var(--lima); border-radius: 6px; padding: 2px 6px; }
  .nome { font-weight: 600; letter-spacing: .2px; }
  .esp { flex: 1; align-self: stretch; }
  .bt { min-width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--fraco); cursor: pointer;
        font: 14px var(--sans); display: grid; place-items: center; padding: 0 6px; }
  .bt:hover { background: #1F2723; color: var(--texto); }
  .bt.on { color: var(--lima); }
  .bt.sair:hover { background: #3A1C1E; color: var(--erro); }
  /* conversa */
  .conversa { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 94%; padding: 8px 11px; border-radius: 10px; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.eu { align-self: flex-end; background: #22301A; border: 1px solid #34481F; white-space: pre-wrap; }
  .msg.kc { align-self: flex-start; background: var(--painel); border: 1px solid var(--borda); }
  .msg.kc p { margin: 0 0 6px; } .msg.kc p:last-child { margin-bottom: 0; }
  .msg.kc ul, .msg.kc ol { margin: 2px 0 6px; padding-left: 20px; }
  .msg.kc h1, .msg.kc h2, .msg.kc h3 { font-size: 14.5px; margin: 6px 0 4px; }
  .msg.kc code { font: 12.5px var(--mono); background: #0B0E0D; border: 1px solid var(--borda); border-radius: 4px; padding: 0 4px; }
  .msg.kc pre { background: #0B0E0D; border: 1px solid var(--borda); border-radius: 6px; padding: 8px; overflow-x: auto; margin: 4px 0 6px; }
  .msg.kc pre code { border: 0; padding: 0; background: none; white-space: pre; }
  .msg.kc a { color: var(--lima); }
  .msg.kc table { border-collapse: collapse; font-size: 12.5px; margin: 4px 0; display: block; overflow-x: auto; }
  .msg.kc td, .msg.kc th { border: 1px solid var(--borda); padding: 2px 6px; }
  .msg.sis { align-self: center; color: var(--fraco); font-size: 12.5px; background: none; border: 0; text-align: center; white-space: pre-wrap; }
  .msg.erro { align-self: stretch; color: var(--erro); background: #2A1517; border: 1px solid #4A2326; white-space: pre-wrap; font-size: 13px; }
  /* passos (ferramentas) recolhidos */
  .passo { align-self: stretch; font: 12.5px/1.45 var(--mono); color: var(--fraco); border-left: 2px solid var(--borda); padding: 1px 0 1px 8px; }
  .passo summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .passo summary::-webkit-details-marker { display: none; }
  .passo summary b { color: var(--texto); font-weight: 600; }
  .passo.ok { border-left-color: #4D6A22; } .passo.falhou { border-left-color: #7A2F33; } .passo.falhou summary b { color: var(--erro); }
  .passo pre { margin: 4px 0 2px; max-height: 220px; overflow: auto; white-space: pre-wrap; background: #0B0E0D; border: 1px solid var(--borda);
               border-radius: 6px; padding: 6px 8px; color: #C7D2CB; }
  /* antes × depois e resumo dos arquivos mudados */
  .qtd { margin-left: 6px; } .qtd i { font-style: normal; font-weight: 600; }
  .qtd .a { color: #8FD14F; } .qtd .r { color: #E0787E; }
  .passo pre.diff { white-space: pre; padding: 4px 0; max-height: 320px; }
  .diff span { display: block; padding: 0 8px; white-space: pre-wrap; }
  .diff .dl-a { background: #16301A; color: #B8E6A0; } .diff .dl-r { background: #34181B; color: #F0A9AD; }
  .diff .dl-c { color: #8C9A92; } .diff .dl-p { color: #5A6660; text-align: center; }
  .mud { align-self: stretch; border: 1px solid var(--borda); border-radius: 10px; padding: 8px 10px; background: var(--painel); font-size: 13px; }
  .mud .t { font-weight: 600; margin-bottom: 4px; }
  .mud .arq { display: flex; justify-content: space-between; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font: 12.5px var(--mono); }
  .mud .arq:hover { background: #0B0E0D; } .mud .arq .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mud .arq small { color: var(--fraco); }
  /* janela grande (⤢): mais espaço para ler */
  html.grande .msg { max-width: 82%; } html.grande .passo pre { max-height: 70vh; }
  html.grande .perm pre { max-height: 50vh; }
  .cnt.igual { outline: 1px dashed var(--aviso); outline-offset: 2px; }
  /* cartão de permissão */
  .perm { align-self: stretch; background: #1C1A10; border: 1px solid #5C4F1C; border-radius: 10px; padding: 10px 12px; }
  .perm .t { font-weight: 600; margin-bottom: 4px; }
  .perm .t small { color: var(--fraco); font-weight: 400; }
  .perm pre { margin: 6px 0 8px; white-space: pre-wrap; font: 12.5px var(--mono); background: #0B0E0D; border: 1px solid var(--borda);
              border-radius: 6px; padding: 6px 8px; max-height: 160px; overflow: auto; }
  .perm .bts { display: flex; gap: 8px; }
  .perm button { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--borda); cursor: pointer; font: 600 13px var(--sans); }
  .perm .sim { background: var(--lima); color: var(--fundo); border-color: var(--lima); }
  .perm .nao { background: transparent; color: var(--texto); }
  .perm .sempre { background: transparent; color: var(--lima); border-color: var(--lima); }
  .perm .bts { flex-wrap: wrap; }
  .auto-ok { font-size: 12px; color: var(--fraco); margin: 2px 0; }
  .auto-ok button { background: none; border: 0; color: var(--fraco); text-decoration: underline; cursor: pointer; font: inherit; }
  .perm .nao:hover { background: #2A1517; color: var(--erro); border-color: #4A2326; }
  .perm.respondida { opacity: .6; } .perm.respondida .bts { display: none; }
  .perm .res { font: 12.5px var(--mono); color: var(--fraco); }
  /* faixa de status: o que está acontecendo agora */
  .status { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 14px; font: 12px var(--mono); color: var(--fraco);
            border-top: 1px solid var(--borda); background: var(--fundo); white-space: nowrap; overflow: hidden; }
  .status .ponto { width: 7px; height: 7px; border-radius: 50%; background: #3A4540; flex: none; }
  .status.vivo .ponto { background: var(--lima); animation: pulsa 1.2s ease-in-out infinite; }
  .status.espera .ponto { background: var(--aviso); }
  @keyframes pulsa { 50% { opacity: .35; } }
  .status .faz { color: var(--texto); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; font-family: var(--sans); font-size: 12.5px; }
  .status .num { flex: none; }
  .status .num b { color: var(--texto); font-weight: 500; }
  /* entrada */
  .entrada { position: relative; display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px 8px; border-top: 1px solid var(--borda); background: var(--painel); }
  .campo { flex: 1; display: flex; align-items: flex-start; gap: 6px; background: var(--fundo); border: 1px solid var(--borda);
           border-radius: 10px; padding: 8px 10px; }
  .campo:focus-within { border-color: #4D6A22; }
  .seta { font: 700 14px var(--mono); color: var(--lima); line-height: 22px; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--texto); font: 13.5px/22px var(--sans);
             max-height: 160px; min-height: 22px; padding: 0; }
  .enviar { height: 40px; min-width: 76px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--lima); color: var(--fundo);
            font: 600 14px var(--sans); cursor: pointer; }
  .mic { align-self: center; width: 26px; height: 26px; margin: -2px -4px -2px 0; border: 0; border-radius: 50%; background: transparent;
         color: var(--fraco, #8A9488); font-size: 15px; cursor: pointer; }
  .mic:hover { color: var(--texto); }
  .mic.on { background: var(--lima); color: var(--fundo); animation: mic-pulsa 1.2s ease-in-out infinite; }
  @keyframes mic-pulsa { 50% { opacity: .6; } }
  .enviar:disabled { opacity: .45; cursor: default; }
  .enviar.parar { background: #3A1C1E; color: var(--erro); }
  .meio-tarefa { border-left: 3px solid var(--lima); }
  .print { margin: 4px 0 8px; cursor: zoom-in; max-width: 100%; }
  .print img { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid var(--borda); }
  .print figcaption { font: 11px var(--mono); color: var(--fraco); margin-top: 3px; }
  .longa { color: var(--fraco); font-size: 12.5px; }
  .longa button { margin-left: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--borda); border-radius: 7px;
                  background: transparent; color: var(--lima); font: 600 12px var(--sans); cursor: pointer; }
  /* lista de comandos "/" */
  .cmds { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 4px); max-height: 260px; overflow-y: auto; background: var(--painel);
          border: 1px solid var(--borda); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); padding: 4px; }
  .cmd { display: flex; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; align-items: baseline; }
  .cmd b { font: 600 12.5px var(--mono); color: var(--lima); white-space: nowrap; }
  .cmd span { color: var(--fraco); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd.sel, .cmd:hover { background: #1F2723; }
  .cmd.sel span { color: var(--texto); }
  /* rodapé: pasta e cotas */
  .rodape { display: flex; align-items: center; gap: 12px; padding: 0 12px 8px; background: var(--painel); font: 11.5px var(--mono); color: var(--fraco); }
  .rodape .pasta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; flex: 1; min-width: 0; }
  .rodape .pasta:hover { color: var(--texto); }
  .cota { display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
  .cota:hover { color: var(--texto); }
  [hidden] { display: none !important; }   /* hidden vence o display: flex das classes */
  .cota i { display: block; width: 34px; height: 5px; border-radius: 3px; background: #26302B; overflow: hidden; }
  .cota i b { display: block; height: 100%; width: 0; background: var(--lima); transition: width .4s; }
  /* painel de uso */
  .uso { position: absolute; right: 10px; bottom: 34px; width: 300px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px;
         box-shadow: 0 10px 30px rgba(0, 0, 0, .5); padding: 14px; font-size: 13px; z-index: 5; }
  .uso h4 { margin: 0 0 10px; font-size: 13px; color: var(--fraco); font-weight: 600; letter-spacing: .3px; }
  .uso .bloco { margin-bottom: 12px; }
  .uso .lin { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .uso .lin b { font-weight: 600; }
  .uso .barra { height: 6px; border-radius: 3px; background: #26302B; overflow: hidden; margin-bottom: 4px; }
  .uso .barra b { display: block; height: 100%; background: var(--lima); }
  .uso small { color: var(--fraco); }
  .uso .grade { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; }
  .uso .grade span:nth-child(odd) { color: var(--fraco); }
  /* ── equipe: ajudantes trabalhando (canto de cima, à direita da conversa) ── */
  .meio { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .equipe { position: absolute; top: 10px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; pointer-events: none; }
  .aj { display: flex; align-items: center; gap: 8px; pointer-events: auto; background: rgba(21, 26, 24, .92); border: 1px solid var(--borda);
        border-radius: 999px; padding: 3px 10px 3px 3px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); max-width: 300px;
        animation: entra .35s cubic-bezier(.2, .8, .2, 1); transition: opacity .6s, transform .6s; }
  .aj.sai { opacity: 0; transform: translateY(-6px); }
  @keyframes entra { from { opacity: 0; transform: translateY(-8px) scale(.96); } }
  .av { position: relative; width: 28px; height: 28px; flex: none; }
  .av img, .av .cx { position: absolute; inset: 3px; width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
  .av .cx { display: grid; place-items: center; background: #F2F4F3; color: #111; font: 700 10px var(--mono); }
  /* anel girando enquanto trabalha (só transform: leve) */
  .av::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
                background: conic-gradient(from 0deg, transparent 0 55%, var(--cor) 85%, transparent 100%); animation: gira 1.4s linear infinite;
                -webkit-mask: radial-gradient(circle, transparent 11px, #000 11.5px); }
  .aj.feito .av::before { animation: none; background: var(--cor); opacity: .55; }
  .aj.falhou .av::before { animation: none; background: var(--erro); }
  @keyframes gira { to { transform: rotate(360deg); } }
  .aj .info { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  .aj .nm { font: 600 12px var(--sans); color: var(--texto); white-space: nowrap; }
  .aj .nm small { color: var(--fraco); font: 11px var(--mono); margin-left: 4px; }
  .aj .oq { font: 11px var(--sans); color: var(--fraco); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
  /* resposta de ajudante (falando direto com o Codex/Kani) */
  .msg.aju { align-self: flex-start; background: var(--painel); border: 1px solid var(--borda); border-left: 3px solid var(--cor); }
  .msg.aju .quem { display: flex; align-items: center; gap: 6px; font: 600 12px var(--sans); color: var(--fraco); margin-bottom: 4px; }
  .msg.aju .quem img, .msg.aju .quem .cx { width: 16px; height: 16px; border-radius: 50%; }
  .msg.aju .quem .cx { display: grid; place-items: center; background: #F2F4F3; color: #111; font: 700 7px var(--mono); }
  /* quem responde */
  .quem-bt { cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .modo-bt { cursor: pointer; white-space: nowrap; padding: 1px 7px; border-radius: 6px; border: 1px solid transparent; }
  .modo-bt:hover { color: var(--texto); }
  .modo-bt.on { color: #7FD3E8; border-color: #2B5560; background: #12262B; }
  .perm.plano .md { max-height: 340px; overflow: auto; font-size: 13px; margin: 6px 0 8px; }
  .quem-bt:hover { color: var(--texto); }
  .quem-bt i { width: 7px; height: 7px; border-radius: 50%; background: var(--cor, var(--lima)); }
  .menu-quem { position: absolute; right: 10px; bottom: 34px; width: 270px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px;
               box-shadow: 0 10px 30px rgba(0, 0, 0, .5); padding: 6px; z-index: 6; }
  .menu-quem div { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; }
  .menu-quem div:hover, .menu-quem div.on { background: #1F2723; }
  .menu-quem b { font-size: 13px; display: block; }
  .menu-quem small { color: var(--fraco); font-size: 12px; }
  .menu-quem .av { width: 26px; height: 26px; } .menu-quem .av::before { display: none; }
  .menu-quem .cl { position: absolute; inset: 3px; border-radius: 50%; background: var(--lima); color: var(--fundo); display: grid; place-items: center; font: 700 9px var(--mono); }
  /* habilidades 🧰 */
  .hab { position: absolute; inset: 40px 0 0 0; background: var(--fundo); z-index: 8; display: flex; flex-direction: column; }
  .hab .cab { padding: 12px 14px 8px; border-bottom: 1px solid var(--borda); }
  .hab .cab p { margin: 0 0 8px; color: var(--fraco); font-size: 12.5px; }
  .hab input { width: 100%; background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; color: var(--texto); padding: 7px 10px; font: 13px var(--sans); outline: 0; }
  .hab input:focus { border-color: #4D6A22; }
  .hab .abas { display: flex; gap: 4px; margin-top: 8px; }
  .hab .abas button { border: 0; background: transparent; color: var(--fraco); padding: 4px 10px; border-radius: 999px; cursor: pointer; font: 12.5px var(--sans); }
  .hab .abas button.on { background: var(--lima-suave); color: var(--lima); }
  .hab .lista { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .hab .grupo { font: 600 11px var(--mono); color: var(--fraco); letter-spacing: .5px; text-transform: uppercase; margin: 10px 6px 4px; }
  .hab .item { padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .hab .item:hover { background: #1A201D; }
  .hab .item b { font-size: 13px; font-weight: 600; } .hab .item b code { font: 12px var(--mono); color: var(--lima); }
  .hab .item div { color: var(--fraco); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* imagens coladas/arrastadas: miniaturas antes de enviar e dentro da mensagem */
  .anexos { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 6px; background: var(--painel); }
  .anexo { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 1px solid var(--borda); }
  .anexo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .anexo button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .7);
                  color: #fff; font-size: 11px; line-height: 18px; cursor: pointer; padding: 0; }
  .msg .minis { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg .minis img { max-width: 140px; max-height: 110px; border-radius: 6px; display: block; }
  body.arrastando::after { content: 'Solte a imagem para enviar ao Claude'; position: fixed; inset: 8px; border: 2px dashed var(--lima); border-radius: 14px;
                           background: rgba(14, 17, 16, .85); color: var(--lima); display: grid; place-items: center; font: 600 15px var(--sans); z-index: 40; }
  /* múltipla escolha */
  .perg { align-self: stretch; background: #12191C; border: 1px solid #23414A; border-radius: 10px; padding: 10px 12px; }
  .perg .q { margin-bottom: 10px; }
  .perg .q:last-of-type { margin-bottom: 8px; }
  .perg .hd { display: inline-block; font: 600 11px var(--mono); color: #7FD3E8; background: rgba(127, 211, 232, .1); border-radius: 999px;
              padding: 0 8px; margin-bottom: 4px; letter-spacing: .3px; }
  .perg .tx { font-weight: 600; margin-bottom: 6px; }
  .perg .ops { display: flex; flex-direction: column; gap: 5px; }
  .perg .op { text-align: left; background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; cursor: pointer;
              color: var(--texto); font: 13px var(--sans); }
  .perg .op small { display: block; color: var(--fraco); font-size: 12px; }
  .perg .op:hover { border-color: #3D6A75; }
  .perg .op.on { border-color: #7FD3E8; background: rgba(127, 211, 232, .08); }
  .perg .outra { width: 100%; margin-top: 2px; background: var(--fundo); border: 1px dashed var(--borda); border-radius: 8px; padding: 6px 10px;
                 color: var(--texto); font: 13px var(--sans); outline: 0; }
  .perg .enviar-r { margin-top: 4px; height: 32px; padding: 0 16px; border: 0; border-radius: 8px; background: #7FD3E8; color: #0B1517; font: 600 13px var(--sans); cursor: pointer; }
  .perg .enviar-r:disabled { opacity: .4; cursor: default; }
  .perg.respondida .ops, .perg.respondida .outra, .perg.respondida .enviar-r { display: none; }
  .perg .res { font: 12.5px var(--mono); color: var(--fraco); }
  /* painel estreito das contas, à esquerda */

<script>
  const $ = id => document.getElementById(id);
  const api = () => window.pywebview && pywebview.api;
  const conversa = $('conversa'), texto = $('texto'), enviar = $('enviar');
  const K = {
    ocupada: false, bolha: null, bruto: '', ferr: {}, mud: {}, pasta: '', modelo: '', comandos: [], limite: null,
    // a tarefa em andamento: início, tokens escritos (soma das mensagens) e o tamanho da conversa que o Claude lê
    t0: 0, tokFeitos: 0, tokMsg: 0, contexto: 0, faz: 'Pronto', espera: false,
    // a conversa toda (desde que a janela abriu)
    totTok: 0, totTarefas: 0, totSeg: 0,
  };
  // ── a equipe: quem pode responder e os ajudantes que o Claude chama ──
  const EQUIPE = {
    claude: { nome: 'Claude', cor: '#B6F23A', av: '<span class="cl">Cl</span>', desc: 'Eu, com a equipe: delego ao Codex e à Kani quando couber' },
    codex: { nome: 'Codex', cor: '#E8ECEA', av: '<span class="cx">Cx</span>', desc: 'Direto, na sua conta ChatGPT Plus (não gasta a cota do Claude)' },
    kani: { nome: 'Kani', cor: '#F27FB2', av: '<img src="kani.webp" alt="">', desc: 'Direto, local e grátis: textos curtos, resumos, ideias' },
  };
  const AJ = {};   // ajudantes em ação: quem → {el, t0, tokens, timer}
  K.quem = 'claude';
  K.cotaCodex = null; K.tokCodex = 0; K.tokKani = 0;
  const LOCAIS = [
    { nome: 'nova', desc: 'Conversa nova nesta pasta (a anterior fica guardada)' },
    { nome: 'pasta', desc: 'Trocar a pasta do projeto' },
    { nome: 'model', desc: 'Trocar o modelo do Claude (ex.: /model sonnet)', arg: '<modelo>' },
  ];

  // ── Markdown simples (o que o Claude usa: parágrafos, listas, títulos, código, negrito, links, tabelas) ──
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function linha(t) {
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  }
  function md(src) {
    const out = [], L = src.replace(/\r/g, '').split('\n');
    let i = 0;
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) {
        const cod = []; i++;
        while (i < L.length && !/^```/.test(L[i])) cod.push(L[i++]);
        i++; out.push('<pre><code>' + esc(cod.join('\n')) + '</code></pre>'); continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
        const cel = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => linha(c.trim()));
        let h = '<table><tr>' + cel(l).map(c => '<th>' + c + '</th>').join('') + '</tr>'; i += 2;
        while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) h += '<tr>' + cel(L[i++]).map(c => '<td>' + c + '</td>').join('') + '</tr>';
        out.push(h + '</table>'); continue;
      }
      const tit = l.match(/^(#{1,3})\s+(.*)/);
      if (tit) { out.push(`<h${tit[1].length}>${linha(tit[2])}</h${tit[1].length}>`); i++; continue; }
      if (/^\s*([-*]|\d+[.)])\s+/.test(l)) {
        const num = /^\s*\d/.test(l), it = [];
        while (i < L.length && /^\s*([-*]|\d+[.)])\s+/.test(L[i])) it.push('<li>' + linha(L[i++].replace(/^\s*([-*]|\d+[.)])\s+/, '')) + '</li>');
        out.push((num ? '<ol>' : '<ul>') + it.join('') + (num ? '</ol>' : '</ul>')); continue;
      }
      if (!l.trim()) { i++; continue; }
      const p = [];
      while (i < L.length && L[i].trim() && !/^(```|#{1,3}\s|\s*([-*]|\d+[.)])\s+)/.test(L[i])) p.push(linha(L[i++]));
      out.push('<p>' + p.join('<br>') + '</p>');
    }
    return out.join('');
  }

  // ── sons suaves (sintetizados aqui: sem arquivo, sem licença). Baixos e curtos; 🔈 no topo liga/desliga ──
  const SOM = { ctx: null, on: (() => { try { return localStorage.getItem('kc-som') !== '0'; } catch (e) { return true; } })() };
  function nota(freq, ini, dur, vol = 0.05, tipo = 'sine') {
    const c = SOM.ctx, t = c.currentTime + ini, o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);          // entrada rápida, sem estalo
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);   // cauda macia
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function som(qual) {
    if (!SOM.on) return;
    try {
      SOM.ctx = SOM.ctx || new AudioContext();
      if (SOM.ctx.state === 'suspended') SOM.ctx.resume();
      ({
        enviar: () => nota(1320, 0, 0.07, 0.025),                                       // tic
        pronto: () => { nota(1046.5, 0, 0.35, 0.04); nota(1568, 0.09, 0.45, 0.035); },   // dó → sol, curtinho
        pergunta: () => { nota(880, 0, 0.16, 0.045); nota(880, 0.16, 0.22, 0.045); },     // dois toques: "ei"
        permitido: () => nota(1174.7, 0, 0.12, 0.03),
        erro: () => { nota(392, 0, 0.25, 0.04, 'triangle'); nota(311, 0.12, 0.35, 0.035, 'triangle'); },
      })[qual]?.();
    } catch (e) { /* sem áudio: segue em silêncio */ }
  }
  function somBotao() { $('som').textContent = SOM.on ? '🔈' : '🔇'; $('som').classList.toggle('on', SOM.on); }

  // ── números do jeito que a gente fala ──
  const mil = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mi' : n >= 1000 ? (n / 1000).toFixed(n >= 1e4 ? 0 : 1).replace('.', ',') + ' mil' : String(n | 0);
  const relogio = s => { s = Math.max(0, s | 0); const m = s / 60 | 0; return m >= 60 ? `${m / 60 | 0}h${String(m % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`; };
  function falta(ts) {
    if (!ts) return '';
    let s = ts - Date.now() / 1000;
    if (s <= 0) return 'zerando';
    const d = s / 86400 | 0, h = (s % 86400) / 3600 | 0, m = (s % 3600) / 60 | 0;
    return d ? `${d}d ${h}h` : h ? `${h}h${String(m).padStart(2, '0')}` : `${m} min`;

  // antes × depois linha a linha (LCS depois de tirar o começo e o fim iguais); [tipo, texto], tipo ' ' | '+' | '−'
  function diffLinhas(velho, novo) {
    const a = String(velho || '').split('\n'), b = String(novo || '').split('\n');
    let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
    let ja = a.length, jb = b.length; while (ja > i && jb > i && a[ja - 1] === b[jb - 1]) { ja--; jb--; }
    const A = a.slice(i, ja), B = b.slice(i, jb), out = a.slice(0, i).map(x => [' ', x]);
    if (A.length * B.length > 250000) { A.forEach(x => out.push(['−', x])); B.forEach(x => out.push(['+', x])); }
    else {
      const n = A.length, m = B.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
      for (let x = n - 1; x >= 0; x--) for (let y = m - 1; y >= 0; y--) L[x][y] = A[x] === B[y] ? L[x + 1][y + 1] + 1 : Math.max(L[x + 1][y], L[x][y + 1]);
      let x = 0, y = 0;
      while (x < n || y < m) {
        if (x < n && y < m && A[x] === B[y]) { out.push([' ', A[x]]); x++; y++; }
        else if (x < n && (y === m || L[x + 1][y] >= L[x][y + 1])) out.push(['−', A[x++]]);   // tirado antes do posto
        else out.push(['+', B[y++]]);
      }
    }
    a.slice(ja).forEach(x => out.push([' ', x]));

  const ANX = [];
  function anexosDesenhar() {

  function lerImagem(arq) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(arq), im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1568 / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        const png = arq.type === 'image/png' && arq.size < 1.5e6;   // print de tela: nítido em PNG
        const dados = cv.toDataURL(png ? 'image/png' : 'image/jpeg', 0.9);
        const km = Math.min(1, 200 / Math.max(cv.width, cv.height)), mc = document.createElement('canvas');
        mc.width = Math.round(cv.width * km); mc.height = Math.round(cv.height * km);
        mc.getContext('2d').drawImage(cv, 0, 0, mc.width, mc.height);
        URL.revokeObjectURL(url);
        res({ tipo: png ? 'image/png' : 'image/jpeg', dados: dados.split(',')[1], mini: mc.toDataURL('image/jpeg', 0.8) });
      };
      im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem não abriu')); };
      im.src = url;
    });
  }

        break;
      case 'uso':
        if (ev.novo) { K.tokFeitos += K.tokMsg; K.tokMsg = 0; }
        K.tokMsg = ev.saida || 0;
        if (ev.contexto) K.contexto = ev.contexto;
        status();
        break;
      case 'ferr': {
        K.bolha = null; passo(ev.id, ev.nome, ev.entrada);
        const a = ACOES[ev.nome];
        atividade((a ? a[2] : 'Usando ' + ev.nome) + ' ' + alvo(ev.nome, ev.entrada));
        break;
      }
      case 'ferr_fim': passoFim(ev.id, ev.ok, ev.saida); atividade('Pensando no próximo passo'); break;
      case 'auto_ok': autoOk(ev); break;
      case 'permissao': K.espera = true; cartao(ev); atividade('Esperando você decidir'); som('pergunta'); break;
      case 'pergunta': K.espera = true; cartaoPergunta(ev); atividade('Esperando a sua escolha'); som('pergunta'); break;
      case 'limite': cotas(ev); break;
      case 'ajudante': ajudante(ev); break;
      case 'licao': if (ev.nova) bolha('sis', '📌 Lição guardada para as próximas tarefas: ' + ev.texto); break;
      case 'ajudante_resposta':
        bolhaAjudante(ev.quem, ev.texto, ev.ok);
        ocupada(false);
        if (ev.ok) som('pronto'); else som('erro');
        break;
      case 'local':
        if (ev.acao === 'recarregar') carregar();
        else if (ev.acao === 'pasta') trocarPasta();
        else if (ev.acao === 'aviso') bolha('sis', ev.texto);
        ocupada(false);
        break;
      case 'fim': {
        const longa = (Date.now() - K.t0) > 4000;   // resposta rápida não toca nada (só as tarefas que você esperou)
        K.bolha = null; ocupada(false); resumoMudancas();
        if (ev.erro) { bolha('erro', 'A resposta parou no meio.'); som('erro'); } else if (longa) som('pronto');
        avisoLonga();
        break;
      }
      case 'saiu':
        K.bolha = null; ocupada(false);
        if (ev.erro) { bolha('erro', 'O Claude Code fechou:\n' + ev.erro); som('erro'); }
        break;
      case 'aviso': console.warn(ev.texto); break;
      case 'voz': vozEv(ev); break;
    }
    if (colar) fim();
  };

  // economia: cada passo relê a conversa inteira; o que mais gasta é seguir na mesma conversa ao trocar de assunto
  // (o /usage do Pailer: 89%). Passou de 120 mil (o básico do projeto é ~58 mil), sugere uma nova — uma vez a cada 60 mil
  function avisoLonga() {
    if (!K.contexto || K.contexto < 120000 || K.contexto < (K.avisouEm || 0) + 60000) return;
    K.avisouEm = K.contexto;
    const d = document.createElement('div');
    d.className = 'msg sis longa';
    d.innerHTML = `Conversa longa: cada passo relê ~${mil(K.contexto)} tokens. Se o próximo assunto for outro, uma conversa
      nova gasta bem menos (esta fica guardada). <button>＋ Nova conversa</button>`;
    d.querySelector('button').onclick = () => $('nova').click();
    conversa.appendChild(d); fim();
  }
  function ajustar() {
    texto.style.height = 'auto';
    texto.style.height = Math.min(texto.scrollHeight, 160) + 'px';
    const tem = !!texto.value.trim() || (typeof ANX !== 'undefined' && ANX.length > 0);
    enviar.disabled = !K.ocupada && !tem;
    // no meio da tarefa: com texto escrito o botão manda agora (o Claude lê no próximo passo); vazio, para
    const agora = K.ocupada && tem && K.quem === 'claude';
    enviar.textContent = !K.ocupada ? 'Enviar' : agora ? 'Mandar agora' : 'Parar';
    enviar.classList.toggle('parar', K.ocupada && !agora);
    enviar.title = agora ? 'O Claude lê no próximo passo e muda o rumo, sem parar o que já fez (apague o texto para ver o Parar)' : '';
  }
  async function mandar() {
    const t = texto.value.trim();
    if (K.ocupada && !((t || ANX.length) && K.quem === 'claude')) { api().parar(); atividade('Parando…'); return; }
    if (!t && !ANX.length) return;
    if (K.ocupada) {   // corrigir o rumo: entra na mesma tarefa, sem parar
      $('cmds').hidden = true;
      const imgs = ANX.splice(0);
      anexosDesenhar();
      const b = bolha('eu', t);
      const m = minis(imgs.map(i => i.mini)); if (m) b.prepend(m);
      b.title = 'mandada no meio da tarefa';
      b.classList.add('meio-tarefa');
      fim(); som('enviar');
      texto.value = ''; K.bolha = null; ajustar();
      atividade('Recado entregue: o Claude lê no próximo passo');
      await api().enviar(t, imgs);
      return;
    }
    $('cmds').hidden = true;
    const imgs = ANX.splice(0);
    anexosDesenhar();
    const b = bolha('eu', t);
    const m = minis(imgs.map(i => i.mini)); if (m) b.prepend(m);
    fim();
    som('enviar');
    texto.value = '';
    K.bolha = null;
    ocupada(true);
    if (K.quem !== 'claude' && !t.startsWith('/') && !imgs.length) {   // direto com um ajudante (só texto)
      atividade(`${EQUIPE[K.quem].nome} trabalhando`);
      await api().ajudante(K.quem, t);
      return;
    }
    atividade('Enviando');
    const ok = await api().enviar(t, imgs);
    if (!ok) ocupada(false);
  }
  async function trocarPasta() { if (K.ocupada) return; const p = await api().escolher_pasta(); if (p) carregar(); }
  async function carregar() {
    const i = await api().info();
    $('fixar').classList.toggle('on', i.fixa);
    K.pasta = i.pasta; K.modelo = i.modelo || K.modelo; K.comandos = i.comandos || K.comandos;
    K.cotaCodex = i.cota_codex || K.cotaCodex;
    api().contas_listar().then(d => { CT.dados = d; contaBotao(); })
      .then(() => api().conta_atualizar()).then(d => { CT.dados = d; contaBotao(); cotasDaConta(); });
    quemDefinir(i.quem || 'claude', false);
    modoMostrar(i.modo || 'auto');
    $('pasta').textContent = '📁 ' + base(i.pasta);
    $('pasta').title = i.pasta + ' · clique para trocar a pasta do projeto';
    cotas(i.limite);
    conversa.innerHTML = '';
    K.ferr = {}; K.mud = {}; K.avisouEm = 0; K.contexto = 0;
    const h = await api().historico();
    if (!h.length) bolha('sis', 'Conversa nova em ' + base(i.pasta) + '.\nEdito e rodo comandos comuns aqui sem perguntar; o que for arriscado (apagar fora da pasta, commit, push, enviar para a internet, fechar programa) eu peço antes.');
    const respostas = {};
    const escolhas = {};
    h.forEach(ev => { if (ev.t === 'permissao_fim') respostas[ev.id] = ev.ok; if (ev.t === 'pergunta_fim') escolhas[ev.id] = ev.respostas; });
    for (const ev of h) {
      if (ev.t === 'eu') { const b = bolha('eu', ev.texto); const m = minis(ev.minis); if (m) b.prepend(m); }
      else if (ev.t === 'pergunta') cartaoPergunta(ev, escolhas[ev.id] || { '': '(sem resposta)' });
      else if (ev.t === 'kc') bolha('kc', md(ev.texto));
      else if (ev.t === 'ferr') passo(ev.id, ev.nome, ev.entrada);
      else if (ev.t === 'ferr_fim') passoFim(ev.id, ev.ok, ev.saida);
      else if (ev.t === 'fim') resumoMudancas();
      else if (ev.t === 'auto_ok') autoOk(ev);
      else if (ev.t === 'permissao') cartao(ev, ev.id in respostas ? respostas[ev.id] : false);
    }
    ocupada(!!i.ocupada);
    if (!i.ocupada) { K.faz = 'Pronto'; $('num').textContent = ''; status(); }
    fim();
    if (!K.comandos.length) api().preparar();   // abre o Claude Code já (a lista "/" chega sem esperar a 1ª mensagem)
  }

  texto.addEventListener('input', () => { ajustar(); comandosFiltrar(); });
  texto.addEventListener('keydown', e => {
    if (!$('cmds').hidden) {
      const n = CM.lista.length;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        CM.sel = (CM.sel + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
        $('cmds').querySelectorAll('.cmd').forEach((d, i) => d.classList.toggle('sel', i === CM.sel));
        $('cmds').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
        return;
      }
      if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey && texto.value.trim() !== '/' + (CM.lista[CM.sel] || {}).nome)) { e.preventDefault(); comandoEscolher(CM.sel); return; }
      if (e.key === 'Escape') { e.preventDefault(); $('cmds').hidden = true; return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (texto.value.trim() || ANX.length) mandar(); }
  });
  enviar.addEventListener('click', mandar);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('uso').hidden) { $('uso').hidden = true; return; }
    if (!$('hab').hidden) { $('hab').hidden = true; return; }
    if (!$('menu-quem').hidden) { $('menu-quem').hidden = true; return; }
    if (!$('contas').hidden) { $('contas').hidden = true; return; }
    api() && api().esconder();
  });
  document.addEventListener('mousedown', e => {
    if (!$('uso').hidden && !e.target.closest('#uso, .cota')) $('uso').hidden = true;
    if (!$('menu-quem').hidden && !e.target.closest('#menu-quem, #quem-bt')) $('menu-quem').hidden = true;
    if (!$('contas').hidden && !e.target.closest('#contas, #lado-aj, .caixa')) $('contas').hidden = true;
  });
  conversa.addEventListener('click', e => { const a = e.target.closest('a'); if (a) e.preventDefault(); });
  $('recolher').addEventListener('click', () => api().esconder());
  $('sair').addEventListener('click', () => api().sair());
  $('revisar').addEventListener('click', () => {
    if (K.ocupada) return;
    quemDefinir('claude', false);
    texto.value = '/code-review'; mandar();
  });
  $('nova').addEventListener('click', async () => { if (K.ocupada) return; await api().nova(); carregar(); });
  $('pasta').addEventListener('click', trocarPasta);
  $('som').addEventListener('click', () => {
    SOM.on = !SOM.on;
    try { localStorage.setItem('kc-som', SOM.on ? '1' : '0'); } catch (e) { /* ok */ }
    somBotao();
    if (SOM.on) som('permitido');
  });
  somBotao();
  // ── Ei Kani (voz.py): o texto falado entra na caixa e vai como se fosse digitado ──
  function vozBotao(on) { $('voz').classList.toggle('on', !!on); }
  function vozEv(ev) {
    $('mic').classList.toggle('on', ev.fase === 'ouvindo');
    if (ev.fase === 'ouvindo') atividade('Ouvindo… fale o pedido');
    else if (ev.fase === 'transcrevendo') atividade('Entendendo o que você falou');
    else if (ev.fase === 'escutando' && !K.ocupada) atividade('Pronto');
    else if (ev.fase === 'desligada') { vozBotao(false); if (!K.ocupada) atividade('Pronto'); }
    else if (ev.fase && ev.fase.startsWith('erro:')) { bolha('erro', 'Ei Kani: ' + ev.fase.slice(5)); vozBotao(false); }
    else if (ev.fase === 'texto' && ev.texto) {
      // comandos falados que o KaniCode resolve sozinho: "para" interrompe; "cancela/esquece" não manda nada
      const c = ev.texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, '').trim();
      if (/^(para|pare|parar|chega)( tudo)?$/.test(c)) { if (K.ocupada) { api().parar(); atividade('Parando…'); } return; }
      if (/^(cancela|cancelar|esquece|deixa|deixa pra la|nada)$/.test(c)) { atividade('Pronto'); return; }
      texto.value = ev.texto + ' (por voz)'; ajustar(); mandar();
    }
  }
  $('voz').addEventListener('click', async () => {
    const ligar = !$('voz').classList.contains('on');
    const r = await api().voz(ligar);
    vozBotao(r.on);
    if (r.erro) bolha('erro', 'Ei Kani: ' + r.erro);
    else bolha('sis', r.on ? '🎙 Ei Kani ligado: diga "Ei Kani" e o pedido.' : 'Ei Kani desligado.');
  });
  $('mic').addEventListener('click', async e => {
    e.preventDefault();
    const fim = $('mic').classList.contains('on');
    if (!fim) atividade('Ligando o microfone…');
    const r = await api().ouvir(fim);
    if (r && r.erro) bolha('erro', 'Microfone: ' + r.erro);
  });
  setTimeout(() => api().voz(null).then(r => vozBotao(r.on)).catch(() => {}), 2500);
  $('quem-bt').addEventListener('click', menuQuem);
  $('habil').addEventListener('click', habAbrir);
  $('c5').addEventListener('click', alternarUso);
  $('csem').addEventListener('click', alternarUso);
  $('grande').addEventListener('click', async () => {
    const on = !document.documentElement.classList.contains('grande');
    const r = await api().expandir(on);
    document.documentElement.classList.toggle('grande', !!r);
    $('grande').classList.toggle('on', !!r); $('grande').textContent = r ? '⤡' : '⤢';
  });
  $('fixar').addEventListener('click', async () => { const on = !$('fixar').classList.contains('on'); $('fixar').classList.toggle('on', await api().fixar(on)); });
  // ── esticar a janela pelas bordas: o Python move/redimensiona a janela nativa (pixels físicos) ──
  ['n', 's', 'l', 'o', 'no', 'ne', 'so', 'se'].forEach(lado => {
    const g = document.createElement('div');
    g.className = 'tam ' + lado;
    g.title = lado === 'se' ? 'Arraste para mudar o tamanho (duplo clique: tamanho padrão)' : '';
    document.body.appendChild(g);
    let ini = null, alvo = null, indo = false;
    const mandar = async () => {
      if (indo || !alvo) return;
      indo = true; const a = alvo; alvo = null;
      try { await api().tam_mudar(...a); } catch (e) { /* ok */ }
      indo = false; if (alvo) mandar();
    };
    g.addEventListener('pointerdown', async e => {
      if (e.button !== 0) return;
      e.preventDefault(); g.setPointerCapture(e.pointerId);
      ini = { sx: e.screenX, sy: e.screenY, r: await api().tam_inicio(), k: window.devicePixelRatio || 1 };
    });
    g.addEventListener('pointermove', e => {
      if (!ini) return;
      const dx = (e.screenX - ini.sx) * ini.k, dy = (e.screenY - ini.sy) * ini.k;
      let [x, y, w, h] = ini.r;
      if (lado.includes('l') || lado === 'ne' || lado === 'se') w += dx;
      if (lado === 'o' || lado === 'no' || lado === 'so') { x += dx; w -= dx; }
      if (lado.includes('s')) h += dy;
      if (lado.includes('n')) { y += dy; h -= dy; }
      const mw = 340 * ini.k, mh = 420 * ini.k;   // não deixa a borda esquerda/de cima empurrar a janela no mínimo
      if (w < mw) { if (x !== ini.r[0]) x -= mw - w; w = mw; }
      if (h < mh) { if (y !== ini.r[1]) y -= mh - h; h = mh; }
      alvo = [Math.round(x), Math.round(y), Math.round(w), Math.round(h)]; mandar();
    });
    const soltar = () => { if (!ini) return; ini = null; setTimeout(() => api().tam_fim(window.kcExtra ? kcExtra() : 0), 120); };
    g.addEventListener('pointerup', soltar);
    g.addEventListener('lostpointercapture', soltar);
    if (lado === 'se') g.addEventListener('dblclick', () => api().tam_padrao());
  });
  window.addEventListener('pywebviewready', () => { carregar(); texto.focus(); });
</script>
<script src="paineis.js"></script>
</body>
